<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="128" fill="#0B0F14" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Sound Waves -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#60A5FA" stroke-width="6" stroke-opacity="0.3" stroke-dasharray="12 12" />
  <circle cx="256" cy="230" r="130" fill="none" stroke="#93C5FD" stroke-width="8" stroke-opacity="0.4" />

  <!-- Microphone Main Body -->
  <g filter="url(#shadow)">
    <!-- Mic capsule -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="url(#micGrad)" />
    
    <!-- Sound wave lines across capsule -->
    <line x1="228" y1="180" x2="284" y2="180" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="224" y1="205" x2="288" y2="205" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="228" y1="230" x2="284" y2="230" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

    <!-- Mic U-cradle -->
    <path d="M186 215 C186 295, 326 295, 326 215" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic stem -->
    <line x1="256" y1="295" x2="256" y2="350" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic base -->
    <line x1="200" y1="350" x2="312" y2="350" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Currency / Growth badge floating at bottom right -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="360" r="64" fill="#10B981" />
    <text x="360" y="380" font-family="Inter, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">Rp</text>
  </g>
</svg>
